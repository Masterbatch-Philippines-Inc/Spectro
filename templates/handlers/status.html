{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-5">
  <div class="w-full max-w-sm text-center">
    <div id="statusIcon" class="w-16 h-16 rounded-2xl border-[1.5px] border-border flex items-center justify-center text-muted-foreground mx-auto mb-4"></div>
    <h2 id="statusHeadline" class="text-[16px] font-bold tracking-tight mb-1.5">-</h2>
    <p id="statusMessage" class="text-[12.5px] text-muted-foreground mb-5 leading-relaxed">—</p>
    <button id="statusBackBtn" type="button" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer hover:opacity-90 transition inline-block">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path></svg>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>
      Take me back
    </button>
  </div>
</div>

<div id="statusCode" data-status-code="{{ status_code }}" style="display:none;"></div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/handlers/status.js' %}"></script>
{% endblock %}
