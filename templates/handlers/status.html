{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-5">
  <div class="w-full max-w-sm text-center">
    <div id="statusIcon" class="w-16 h-16 rounded-2xl border-[1.5px] border-border flex items-center justify-center text-muted-foreground mx-auto mb-4"></div>
    <h2 id="statusHeadline" class="text-[16px] font-bold tracking-tight mb-1.5">-</h2>
    <p id="statusMessage" class="text-[12.5px] text-muted-foreground mb-5 leading-relaxed">—</p>
    <button id="statusBackBtn" type="button" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer hover:opacity-90 transition inline-flex items-center gap-1.5">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Take me back</span>
    </button>
  </div>
</div>

<div id="statusCode" data-status-code="{{ status_code }}" style="display:none;"></div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/handlers/status.js' %}"></script>
{% endblock %}
