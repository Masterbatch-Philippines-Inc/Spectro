{% comment %}
============================================================
Shared dropdown component. Two variants via `dropdown_type`:

  "select" (default) -- plain native <select>, options passed as list
  of (value, label) tuples via `dropdown_options`.

    {% include "components/shared/ui/dropdown.html" with
        dropdown_id="productCodeFilter"
        dropdown_options=product_code_options
        dropdown_placeholder="Choose a Product Code" %}

  "menu" -- custom button that reveals a floating panel; page supplies
  the panel's inner content as {% block dropdown_panel %} on the
  including template, or via a separate include right after this one
  targeting #<dropdown_id>Panel .

    {% include "components/shared/ui/dropdown.html" with
        dropdown_type="menu"
        dropdown_id="freezeDropdown"
        dropdown_label="Freeze Columns Filter" %}

Requires dropdown.js (initDropdowns) which is auto-loaded by base.js.
============================================================
{% endcomment %}

{% if dropdown_type == "combobox" %}
<div class="relative" data-combobox {% if dropdown_remote_url %}data-combobox-remote-url="{{ dropdown_remote_url }}"{% else %}data-combobox-options="{{ dropdown_options_json }}"{% endif %}>
  <input type="text" id="{{ dropdown_id }}" autocomplete="off"
    placeholder="{{ dropdown_placeholder|default:'Type to search...' }}"
    {% if dropdown_disabled %}disabled{% endif %}
    class="text-[12.5px] px-2.5 py-1.5 rounded-md border border-border bg-card min-w-[170px] outline-none focus:ring-2 focus:ring-ring/40 focus:border-ring disabled:opacity-50 disabled:cursor-not-allowed">
  <input type="hidden" id="{{ dropdown_id }}Value">
  <div id="{{ dropdown_id }}Suggestions" class="hidden absolute left-0 top-[calc(100%+4px)] z-50 w-full min-w-[200px] max-h-[640px] bg-card border border-border rounded-md shadow-lg max-h-[220px] overflow-y-auto"></div>
</div>

{% elif dropdown_type == "menu" %}
<div class="relative" data-dropdown-menu>
  <button id="{{ dropdown_id }}Btn" type="button"
    {% if dropdown_disabled %}disabled{% endif %}
    class="disabled:opacity-50 disabled:cursor-not-allowed text-[12.5px] px-2.5 py-1.5 rounded-md border border-border bg-card min-w-[110px] flex items-center justify-between gap-1.5 cursor-pointer hover:bg-accent">
    <span id="{{ dropdown_id }}Label">{{ dropdown_label|default:"Select" }}</span>
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <div id="{{ dropdown_id }}Panel" class="hidden absolute left-0 top-[calc(100%+4px)] z-50 w-[200px] bg-card border border-border rounded-md shadow-lg p-2 flex flex-col gap-0.5">
    {% block dropdown_panel %}{% endblock %}
  </div>
</div>

{% else %}

<select id="{{ dropdown_id }}"
  {% if dropdown_disabled %}disabled{% endif %}
  class="text-[12.5px] px-2.5 py-1.5 pr-7 rounded-md border border-border bg-card min-w-[170px] cursor-pointer outline-none focus:ring-2 focus:ring-ring/40 focus:border-ring disabled:opacity-50 disabled:cursor-not-allowed">
  <option value="">{{ dropdown_placeholder|default:"Select..." }}</option>
  {% for value, label in dropdown_options %}
    <option value="{{ value }}">{{ label }}</option>
  {% endfor %}
</select>
{% endif %}
