{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-5">
  <div class="w-full max-w-sm border border-border rounded-xl shadow-md p-6">

    <div class="flex flex-col items-center text-center gap-1.5 mb-2">
      <img src="{% static 'img/spectro.svg' %}" alt="MBPI Spectro" class="flex items-center justify-center text-[9px] font-bold shrink-0" width="30">
      <h2 class="text-[17px] font-bold tracking-tight">Reset Password</h2>
    </div>

    <p class="text-[12.5px] text-muted-foreground text-center mb-5 leading-relaxed">Enter your account email and we'll send you a link to reset your password.</p>

    {% if form.errors %}
      <p class="text-[11.5px] text-danger text-center mb-3.5">Please enter a valid email address.</p>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="field mb-5">
        <label for="id_email" class="block text-xs font-semibold mb-1.5">Email</label>
        <input type="email" name="email" id="id_email" autocomplete="email" required
          class="input w-full text-[13px] py-2.5 px-2.5 rounded-lg border border-border bg-card text-foreground outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/40">
      </div>
      <button type="submit" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer w-full hover:opacity-90 transition">
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-5">
      <a href="{% url 'auth_login' %}" class="text-[11.5px] text-muted-foreground hover:text-foreground underline">Back to Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
