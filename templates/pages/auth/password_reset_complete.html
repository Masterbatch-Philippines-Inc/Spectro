{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-5">
  <div class="w-full max-w-sm border border-border rounded-xl shadow-md p-6 text-center">

    <div class="flex flex-col items-center gap-1.5 mb-2">
      <img src="{% static 'img/spectro.svg' %}" alt="MBPI Spectro" class="flex items-center justify-center text-[9px] font-bold shrink-0" width="30">
      <h2 class="text-[17px] font-bold tracking-tight">Password Updated</h2>
    </div>

    <p class="text-[12.5px] text-muted-foreground mb-5 leading-relaxed">Your password has been changed successfully.</p>

    <a href="{% url 'auth_login' %}" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer w-full hover:opacity-90 transition inline-block">
      Sign In
    </a>

  </div>
</div>
{% endblock %}
