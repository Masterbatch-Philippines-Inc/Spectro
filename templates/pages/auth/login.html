{% extends "base.html" %}
{% load static %}

{% block content %}
{% if error %}
{% endif %}
<div class="flex-1 flex items-center justify-center px-5">
  <div class="w-full max-w-sm border border-border rounded-xl shadow-md p-6">

    <div class="flex flex-col items-center text-center gap-1.5 mb-2">
      <img
        src="{% static 'img/spectro.svg' %}"
        alt="MBPI Spectro"
        class="flex items-center justify-center text-[9px] font-bold shrink-0" width="30"
      >
      <h2 class="text-[17px] font-bold tracking-tight">Spectro</h2>
    </div>

    <p class="text-[12.5px] text-muted-foreground text-center mb-5 leading-relaxed">Use your account credentials to continue.</p>

    <form method="post" action="">
      {% csrf_token %}

      {% if error %}
        <script>
          window.addEventListener('load', function () {
            showToast('toastStack', '{{ error|escapejs }}', 'warning');
          });
        </script>
      {% endif %}

      <div class="field mb-3.5">
        <label for="id_username" class="block text-xs font-semibold mb-1.5">Username</label>
        <input type="text" name="username" id="id_username" autocomplete="username"
          class="input w-full text-[13px] py-2.5 px-2.5 rounded-lg border border-border bg-card text-foreground outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/40">
      </div>

      <div class="field mb-2">
        <label for="id_password" class="block text-xs font-semibold mb-1.5">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password"
          class="input w-full text-[13px] py-2.5 px-2.5 rounded-lg border border-border bg-card text-foreground outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/40">
      </div>

      <div class="text-right mb-5">
        <a href="{% url 'password_reset' %}" class="text-[11.5px] text-muted-foreground hover:text-foreground underline">Forgot password?</a>
      </div>

      <button type="submit" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer w-full hover:opacity-90 transition">
        Sign In
      </button>
    </form>

  </div>
</div>
{% endblock %}
