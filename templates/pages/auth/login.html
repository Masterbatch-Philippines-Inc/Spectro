{% extends "base.html" %}
{% load static %}

{% block title %}Sign In - MBPI SPECTRO{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-accent px-5">
  <div class="w-full max-w-[380px] bg-card border border-border rounded-xl shadow-md p-7">

    <div class="flex items-center gap-2.5 mb-6">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25"/><path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></svg>
      <div class="text-[17px] font-bold tracking-tight">MBPI SPECTRO</div>
    </div>

    <p class="text-sm font-semibold m-0 mb-1">Sign in</p>
    <p class="text-[12.5px] text-muted-foreground mb-5 leading-relaxed">Use your account credentials to continue.</p>

    <form method="post" action="">
      {% csrf_token %}

      {% if error %}
        <div class="text-[12px] text-danger bg-danger-bg border border-danger-border rounded-md px-3 py-2 mb-3.5">
          {{ error }}
        </div>
      {% endif %}

      <div class="field mb-3.5">
        <label for="id_username" class="block text-xs font-semibold mb-1.5">Username</label>
        <input type="text" name="username" id="id_username" autocomplete="username"
          class="input w-full text-[13px] py-2.5 px-2.5 rounded-lg border border-border bg-card text-foreground outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/40">
      </div>

      <div class="field mb-5">
        <label for="id_password" class="block text-xs font-semibold mb-1.5">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password"
          class="input w-full text-[13px] py-2.5 px-2.5 rounded-lg border border-border bg-card text-foreground outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/40">
      </div>

      <button type="submit" class="btn bg-primary text-primary-foreground border border-primary text-[13px] font-medium py-2.5 px-3.5 rounded-lg cursor-pointer w-full hover:opacity-90 transition">
        Sign In
      </button>
    </form>

  </div>
</div>
{% endblock %}
