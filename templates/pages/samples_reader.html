{% block extra_js %}<script>
  window.getScatterPlotPoints = function () {
    return dataset
      .filter(r => r.da !== null && r.db !== null)
      .filter(r => selectedRows.size === 0 || selectedRows.has(r.id))
      .map(r => ({ id: r.id, name: r.stickerLot, da: r.da, db: r.db, passed: r.spectroJudgement === 'PASSED' }));
  };
</script>
{% endblock %}
